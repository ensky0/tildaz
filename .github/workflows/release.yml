name: Release

# 트리거
#   - 태그 푸시 (v*): 해당 태그를 checkout해 자동 실행
#   - workflow_dispatch: 수동 재시도 / Actions 단독 실행. 태그 이름 입력 필수.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v0.6.2-dev.2)'
        required: true

permissions:
  contents: write   # gh release create 에 필요

# Node.js 20 deprecation (2026-09-16 제거 예정) 회피. checkout(@v7) 와
# action-gh-release(@v3) 는 Node 24 native 로 올렸고, 남은 mlugg/setup-zig@v2
# 만 아직 Node 20 번들이라 runner 가 강제 Node 24 로 실행하게 이 env 를 유지.
# upstream 이 Node 24 버전을 내면 제거 (#257).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-windows:
    # x64 + arm64 두 architecture 를 windows-2022 (x86_64 호스트) 에서 cross-build.
    # zig 가 PE/COFF 양쪽 모두 cross 가능 + 우리 의존성 (kernel32 / user32 / ConPTY
    # bundle) 은 arch 별 binary 를 빌드 시점에 선택 ([build.zig:166](build.zig#L166)).
    # ARM64 실 device smoke test 는 별도 후속 작업 (#191 완료 조건의 별 항목).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            zig_target: x86_64-windows
          - arch: arm64
            zig_target: aarch64-windows
    runs-on: windows-2022
    steps:
      - name: Resolve tag / version
        id: vars
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$VERSION"

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 1

      # mlugg/setup-zig 는 community mirror list fallback 내장 (ziglang.org 가
      # Actions runner 에서 mid-transfer RST 던지는 케이스를 흡수). 과거 v1 시점
      # 에는 0.15.x 의 새 파일명 패턴 (`zig-x86_64-windows-...`) 미지원으로 깨졌으나
      # v2.2.0+ 에서 fix 됨. action 의 use-cache 는 false — 우리가 ZIG_GLOBAL_CACHE_DIR
      # 을 직접 D: 로 맞춰야 cross-drive convertPathArg assert 회피 가능 (아래 step).
      - name: Setup Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      # windows-2022 러너의 checkout 은 D:\ 에 떨어지는데 기본 zig global cache 는
      # C:\Users\runneradmin\AppData\Local\zig 라 크로스 드라이브.
      # std.fs.path.relative(C:..., D:...) 가 상대경로를 못 만들고 absolute 리턴 →
      # zig Run step (convertPathArg) assert. ZIG_GLOBAL_CACHE_DIR 을 RUNNER_TEMP
      # (D:) 로 통일해 해결.
      - name: "Set Zig global cache dir on D:"
        shell: bash
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=${RUNNER_TEMP}/zig-global-cache" >> "$GITHUB_ENV"

      - name: Verify Zig
        shell: bash
        run: zig version

      - name: Sanity checks (version / release notes / pinned deps)
        id: sanity
        shell: bash
        run: |
          set -euo pipefail

          ZON_VER=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)",[[:space:]]*$/\1/p' build.zig.zon)
          if [[ -z "$ZON_VER" ]]; then
            echo "ERROR: could not parse build.zig.zon version"
            exit 1
          fi
          if [[ "$ZON_VER" != "${{ steps.vars.outputs.version }}" ]]; then
            echo "ERROR: build.zig.zon version ($ZON_VER) != tag version (${{ steps.vars.outputs.version }})"
            exit 1
          fi

          NOTES="dist/release-notes/${{ steps.vars.outputs.tag }}.md"
          if [[ -f "$NOTES" ]]; then
            echo "notes_path=$NOTES" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.vars.outputs.version }}" == *-* ]]; then
            echo "notes_path=" >> "$GITHUB_OUTPUT"
            echo "prerelease notes not provided (allowed): $NOTES"
          else
            echo "ERROR: release notes missing at $NOTES"
            exit 1
          fi

          # build.zig.zon 의 github archive URL 은 전부 특정 SHA 로 pin 되어야 함.
          # refs/heads/ · refs/tags/ 같은 rolling reference 는 upstream 이 움직이면
          # CI fetch 가 해시 불일치로 터지므로 금지. (과거 c41a9ef → e10e78f 회귀로
          # 한 번 깨진 뒤 v0.2.10 에서 다시 핀 + 이 check 추가)
          BAD=$(grep -E '\.url[[:space:]]*=[[:space:]]*"https://github\.com/' build.zig.zon | grep -v -E '/archive/[0-9a-f]{40}\.tar\.gz"' || true)
          if [[ -n "$BAD" ]]; then
            echo "ERROR: build.zig.zon 에 rolling / non-SHA dependency URL 이 있음:"
            echo "$BAD"
            echo ""
            echo "github archive URL 은 반드시"
            echo "  https://github.com/<org>/<repo>/archive/<40-hex-sha>.tar.gz"
            echo "형식이어야 합니다. refs/heads/ 나 refs/tags/ 는 금지."
            echo ""
            echo "갱신하려면: ./dist/update-ghostty.sh"
            exit 1
          fi

          echo "build.zig.zon version : $ZON_VER"
          if [[ -f "$NOTES" ]]; then
            echo "release notes     : $NOTES"
          else
            echo "release notes     : omitted for prerelease"
          fi
          echo "pinned deps       : OK"

      # Zig 0.15 의 Windows HTTP client 가 github.com 에서 transitive deps
      # (ghostty 아래 imgui, vaxis 아래 zigimg / uucode 등) 를 받을 때 가끔
      # `HttpConnectionClosing` / `WriteFailed` 로 깨짐. fetch 만 선행 + 재시도
      # 해서 네트워크 플래키함을 흡수하고, 이후 build 는 캐시된 상태로 한 번에.
      #
      # `--fetch` (needed) 사용 — `--fetch=all` 은 폰트용 lazy 의존성
      # (ghostty → fontconfig → libxml2) 까지 전부 받는데, 우리는 ghostty 의
      # `emit-lib-vt` (VT 파서 모듈) 만 써서 이들을 빌드에 안 쓴다. 특히 libxml2
      # tarball 은 Unix 심볼릭 링크 (test fixtures) 를 담고 있어, 심볼릭 링크
      # 권한 없는 Windows 환경 (Developer Mode off) 에선 unpack 이 AccessDenied
      # 로 실패한다. needed 만 받으면 그 unpack 자체를 회피 + 불필요한 다운로드
      # 제거. (실제 build step 도 lazy 의존성을 호출하지 않아 빌드 중 추가 fetch 없음.)
      - name: Prefetch dependencies (retry on transient HTTP fail)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if zig build --fetch; then
              echo "All dependencies fetched (attempt $i)"
              exit 0
            fi
            if [[ $i -eq 5 ]]; then
              echo "ERROR: dependency fetch failed after 5 attempts" >&2
              exit 1
            fi
            echo "Fetch attempt $i failed; retrying in 10s..."
            sleep 10
          done

      - name: Build + package (${{ matrix.arch }})
        shell: bash
        # `-Doptimize=ReleaseFast` 명시 — #200 으로 build.zig default 가 Debug
        # 로 바뀐 이후 release artifact 는 안전을 위해 *명시* 적용.
        run: zig build package -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseFast

      - name: Verify artifacts
        id: verify
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ZIP="zig-out/release/tildaz-v${VERSION}-win-${{ matrix.arch }}.zip"
          SHA="$ZIP.sha256"
          if [[ ! -f "$ZIP" || ! -f "$SHA" ]]; then
            echo "ERROR: expected artifacts missing — looked for $ZIP / $SHA"
            ls -la zig-out/release/ || true
            exit 1
          fi
          echo "zip    : $ZIP ($(stat -c %s "$ZIP") bytes)"
          echo "sha256 : $(cat "$SHA")"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # 두 matrix 작업이 *같은 release tag* 에 artifact append.
      # action-gh-release 는 동일 tag 의 release 가 이미 있으면 metadata
      # (name / body / prerelease) 갱신 + files 만 추가. 두 작업이 순서
      # 무관하게 동작.
      - name: Create / append GitHub Release (${{ matrix.arch }})
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          # body_path는 optional. stable은 sanity에서 파일을 강제하고,
          # 파일 없는 prerelease test는 빈 값으로 release body를 생략한다.
          body_path: ${{ steps.sanity.outputs.notes_path }}
          files: |
            ${{ steps.verify.outputs.zip }}
            ${{ steps.verify.outputs.sha }}
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-') }}
          fail_on_unmatched_files: true

  # macOS 빌드는 Apple Silicon runner (macos-15 = aarch64) 에서 cross-build 로
  # aarch64-macos + x86_64-macos 두 target 을 만든 후 `lipo -create` 로 universal
  # binary (Mach-O fat) 로 합쳐 단일 DMG 로 배포 — Intel + Apple Silicon 모두 실행
  # 가능 (#133, dist/macos/package.sh).
  #
  # Apple Developer 계정은 없지만 #109부터 로컬과 같은 self-signed
  # `TildazLocal` identity를 Actions secret에서 임시 Keychain으로 가져와 서명.
  # release 사이 designated requirement가 안정돼 TCC 권한 identity가 유지된다.
  # Developer ID/notarization은 아니므로 첫 다운로드의 quarantine/Gatekeeper
  # 처리는 여전히 별개다.
  release-macos:
    runs-on: macos-15
    env:
      MACOS_SIGN_IDENTITY: TildazLocal
      MACOS_CERTIFICATE_SHA1: 49A04E831C72FA3F4079DB379E31A02E2943C5A3
    steps:
      - name: Resolve tag / version
        id: vars
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 1

      # mlugg/setup-zig — community mirror list fallback 내장. Windows job 의
      # cross-drive 이슈는 macOS 에 없어 use-cache 도 default (true) 로 둠.
      - name: Setup Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Verify Zig
        run: zig version

      - name: Sanity checks (version / release notes / pinned deps)
        run: |
          set -euo pipefail
          ZON_VER=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)",[[:space:]]*$/\1/p' build.zig.zon)
          if [[ -z "$ZON_VER" ]]; then
            echo "ERROR: could not parse build.zig.zon version"
            exit 1
          fi
          if [[ "$ZON_VER" != "${{ steps.vars.outputs.version }}" ]]; then
            echo "ERROR: build.zig.zon version ($ZON_VER) != tag version (${{ steps.vars.outputs.version }})"
            exit 1
          fi
          NOTES="dist/release-notes/${{ steps.vars.outputs.tag }}.md"
          if [[ ! -f "$NOTES" && "${{ steps.vars.outputs.version }}" != *-* ]]; then
            echo "ERROR: release notes missing at $NOTES"
            exit 1
          fi
          if [[ ! -f "$NOTES" ]]; then
            echo "prerelease notes not provided (allowed): $NOTES"
          fi

      - name: Prefetch dependencies
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if zig build --fetch; then
              exit 0
            fi
            [[ $i -eq 5 ]] && exit 1
            sleep 10
          done

      - name: Install macOS signing identity
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./dist/macos/ci-signing.sh install

      - name: Build + package
        # `-Doptimize=ReleaseFast` 명시 (#200) — default 가 Debug 가 된 후
        # macOS package도 명시 적용. self-signed identity는 package.sh의 두
        # architecture build와 lipo 후 최종 app 재서명에 모두 전달 (#109).
        run: zig build package -Doptimize=ReleaseFast -Dmacos-sign-identity="$MACOS_SIGN_IDENTITY"

      - name: Verify artifacts
        id: verify
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          DMG="zig-out/release/tildaz-v${VERSION}-macos.dmg"
          SHA="$DMG.sha256"
          if [[ ! -f "$DMG" || ! -f "$SHA" ]]; then
            echo "ERROR: expected artifacts missing — looked for $DMG / $SHA"
            ls -la zig-out/release/ || true
            exit 1
          fi
          echo "dmg    : $DMG ($(stat -f %z "$DMG") bytes)"
          echo "sha256 : $(cat "$SHA")"
          echo "universal binary architectures:"
          lipo -info "zig-out/TildaZ.app/Contents/MacOS/tildaz"
          ./dist/macos/verify-signing.sh \
            zig-out/TildaZ.app \
            "$MACOS_SIGN_IDENTITY" \
            "$MACOS_CERTIFICATE_SHA1"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Windows job 과 같은 tag 면 같은 release 에 file 추가 (append).
      # softprops/action-gh-release 의 default 동작.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: |
            ${{ steps.verify.outputs.dmg }}
            ${{ steps.verify.outputs.sha }}
          draft: false
          # supported prerelease는 full SemVer에서 '-'가 있으므로 dev/alpha/beta/rc를
          # 개별 나열하지 않고 같은 규칙으로 GitHub prerelease 표시.
          prerelease: ${{ contains(steps.vars.outputs.version, '-') }}
          fail_on_unmatched_files: true

      # cleanup은 upload 뒤에 둔다. trustd/Keychain cleanup이 지연돼도 이미
      # 검증된 DMG upload를 막지 않으며, always()로 실패 경로에서도 실행한다.
      - name: Clean up macOS signing identity
        if: ${{ always() }}
        run: |
          if [[ -x dist/macos/ci-signing.sh ]]; then
            ./dist/macos/ci-signing.sh cleanup
          fi

  # Linux 배포 — 4 format × 2 arch = 8 artifact (#202).
  # ubuntu-22.04 단일 runner 에서 모든 (arch, format) cross-build / cross-package:
  #   - zig 가 x86_64 호스트에서 aarch64-linux-gnu 빌드 가능 (LLVM cross)
  #   - 우리 의존성 모두 runtime dlopen → host glibc 와 무관
  #   - dpkg-deb / rpmbuild / appimagetool 모두 binary metadata 만 다루지 host
  #     arch 와 무관 (포함 binary 가 cross-built 면 그대로 패키징)
  # glibc minor 는 .2.28 pin — RHEL 8 / Debian 10 / Ubuntu 18.04 부터 호환.
  release-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        format: [tar.gz, deb, rpm, AppImage]
        include:
          - arch: x86_64
            zig_target: x86_64-linux-gnu.2.28
          - arch: aarch64
            zig_target: aarch64-linux-gnu.2.28
          # #211 — aarch64 rpm 은 ubuntu-22.04(x86_64 host)의 rpm package 에
          # `aarch64-linux` platform 정의가 없어 cross-build 가 "No compatible
          # architectures found for build" 로 fail (v0.5.0-rc4 확정). 다른
          # (arch,format) 은 x86 runner cross-build OK (dpkg/tar/appimage 는
          # metadata only) 지만 rpm 만 platform lookup 이 필요. → ARM64 runner
          # (ubuntu-24.04-arm, 공개 repo 무료)에서 *native* rpmbuild 로 해결.
          # zig 도 같은 arch 라 native build (cross 아님).
          - arch: aarch64
            format: rpm
            runner: ubuntu-24.04-arm
          # Arch Linux (.pkg.tar.zst) — base 매트릭스에 없는 format 이라 include 로
          # 단일 조합만 추가. archlinux 컨테이너에서 root 로 zig 빌드 후, makepkg 는
          # 비root 가 필요 → build_pkg 가 root 면 `builder` 유저로 떨어뜨려 실행.
          # Arch 공식 아키텍처는 x86_64 뿐 (aarch64 는 Arch Linux ARM 별도).
          - arch: x86_64
            format: pkg
            zig_target: x86_64-linux-gnu.2.28
            container: archlinux:base-devel
    # 기본은 x86_64 호스트 cross-build, aarch64 rpm 만 ARM runner (#211),
    # pkg 만 archlinux 컨테이너 (matrix.container 없으면 빈 값 = 컨테이너 미사용).
    runs-on: ${{ matrix.runner || 'ubuntu-22.04' }}
    container: ${{ matrix.container }}
    steps:
      - name: Resolve tag / version
        id: vars
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # archlinux:base-devel 컨테이너엔 git 이 없어 checkout 이 실패한다 → pkg
      # 조합만 checkout 전에 설치 (다른 조합은 runner 에 git 기본 존재).
      - name: Install git (Arch container)
        if: matrix.format == 'pkg'
        run: pacman -Sy --noconfirm --needed git

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 1

      - name: Setup Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Verify Zig
        run: zig version

      # format 별 호스트 도구. tar.gz 만 표준 (POSIX) — 추가 설치 0.
      # dpkg-deb 는 ubuntu 기본 (build-essential 또는 dpkg-dev). rpm 는 별 install.
      # appimagetool 은 package.sh 가 자동 다운로드.
      - name: Install packaging tools
        run: |
          set -euo pipefail
          case "${{ matrix.format }}" in
              tar.gz)
                  echo "tar.gz — no extra tools needed"
                  ;;
              deb)
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq dpkg-dev
                  dpkg-deb --version
                  ;;
              rpm)
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq rpm
                  rpmbuild --version
                  ;;
              AppImage)
                  # appimagetool 자체는 package.sh 가 다운로드. FUSE 는
                  # --appimage-extract-and-run 으로 회피.
                  echo "AppImage — appimagetool downloaded on demand"
                  ;;
              pkg)
                  # archlinux:base-devel 컨테이너에 makepkg / fakeroot / sudo 포함 —
                  # 추가 설치 없음. (build_pkg 가 root→builder 로 makepkg 실행.)
                  echo "pkg — makepkg/base-devel preinstalled in archlinux container"
                  ;;
          esac

      - name: Sanity checks (version / release notes)
        run: |
          set -euo pipefail
          ZON_VER=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)",[[:space:]]*$/\1/p' build.zig.zon)
          if [[ -z "$ZON_VER" ]]; then
            echo "ERROR: could not parse build.zig.zon version"
            exit 1
          fi
          if [[ "$ZON_VER" != "${{ steps.vars.outputs.version }}" ]]; then
            echo "ERROR: build.zig.zon version ($ZON_VER) != tag version (${{ steps.vars.outputs.version }})"
            exit 1
          fi
          NOTES="dist/release-notes/${{ steps.vars.outputs.tag }}.md"
          if [[ ! -f "$NOTES" && "${{ steps.vars.outputs.version }}" != *-* ]]; then
            echo "ERROR: release notes missing at $NOTES"
            exit 1
          fi
          if [[ ! -f "$NOTES" ]]; then
            echo "prerelease notes not provided (allowed): $NOTES"
          fi

      - name: Prefetch dependencies
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if zig build --fetch; then
              exit 0
            fi
            [[ $i -eq 5 ]] && exit 1
            sleep 10
          done

      - name: Build + package (${{ matrix.arch }} / ${{ matrix.format }})
        # `-Doptimize=ReleaseFast` 명시 (#200) — default 가 Debug 가 된 후
        # Linux release artifact 도 명시 적용.
        run: zig build package -Dtarget=${{ matrix.zig_target }} -Dformat=${{ matrix.format }} -Doptimize=ReleaseFast

      - name: Resolve artifact name
        id: artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
              x86_64)  DEBARCH=amd64 ;;
              aarch64) DEBARCH=arm64 ;;
          esac
          case "${{ matrix.format }}" in
              tar.gz)   MATCHES=(zig-out/release/tildaz-v*-linux-${ARCH}.tar.gz) ;;
              deb)      MATCHES=(zig-out/release/tildaz_*_${DEBARCH}.deb) ;;
              rpm)      MATCHES=(zig-out/release/tildaz-*-1.${ARCH}.rpm) ;;
              AppImage) MATCHES=(zig-out/release/TildaZ-*-${ARCH}.AppImage) ;;
              pkg)      MATCHES=(zig-out/release/tildaz-*-1-x86_64.pkg.tar.zst) ;;
          esac
          if [[ ${#MATCHES[@]} -ne 1 ]]; then
            echo "ERROR: expected exactly one ${{ matrix.format }} artifact, found ${#MATCHES[@]}"
            ls -la zig-out/release/ || true
            exit 1
          fi
          NAME=$(basename "${MATCHES[0]}")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=zig-out/release/$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify artifact
        run: |
          set -euo pipefail
          P="${{ steps.artifact.outputs.path }}"
          S="$P.sha256"
          if [[ ! -f "$P" || ! -f "$S" ]]; then
            echo "ERROR: artifact missing — expected: $P + $S"
            ls -la zig-out/release/ || true
            exit 1
          fi
          echo "artifact : $P ($(stat -c %s "$P") bytes)"
          echo "sha256   : $(cat "$S")"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-') }}
          fail_on_unmatched_files: true
